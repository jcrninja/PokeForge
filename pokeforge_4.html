        </div>
      </div>

      <div id="anthropic-section" style="border-top:1px dashed rgba(255,203,5,0.3); padding-top:12px;">
        <div style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--accent); letter-spacing:1px; margin-bottom:10px;">ANTHROPIC (optional, paid)</div>

        <div style="font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:6px;">API KEY</div>
        <div style="font-family:'VT323', monospace; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">
          Current: <span style="color:var(--ink);">${escapeHtml(maskedKey)}</span>. Stored in browser only.
        </div>
        <input type="password" id="ant-apikey" placeholder="sk-ant-api03-..." style="width:100%; padding:8px; background:#0f1220; color:var(--ink); border:2px solid var(--border); border-radius:3px; font-family:'Space Mono', monospace; font-size:12px; margin-bottom:10px;">

        <div style="font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:6px;">PROXY URL</div>
        <input type="text" id="ant-proxyurl" value="${escapeHtml(cfg.anthropicProxyUrl || DEFAULT_PROXY)}" style="width:100%; padding:8px; background:#0f1220; color:var(--ink); border:2px solid var(--border); border-radius:3px; font-family:'Space Mono', monospace; font-size:12px; margin-bottom:10px;">

        <div style="font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:6px;">MODEL</div>
        <input type="text" id="ant-model" value="${escapeHtml(cfg.anthropicModel || DEFAULT_ANTHROPIC_MODEL)}" style="width:100%; padding:8px; background:#0f1220; color:var(--ink); border:2px solid var(--border); border-radius:3px; font-family:'Space Mono', monospace; font-size:12px; margin-bottom:10px;">
      </div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn" id="ai-settings-save" style="flex:1;">💾 SAVE</button>
        <button class="btn secondary" id="ai-settings-clear">CLEAR KEY</button>
      </div>

      <div style="margin-top:14px; font-family:'VT323', monospace; font-size:13px; color:var(--ink-dim); line-height:1.4; border-top:1px dashed rgba(255,203,5,0.3); padding-top:10px;">
        See <code style="color:var(--accent);">AI_ART_DEBUG.md</code> for full explanations of each backend.
      </div>
    `;
    $('#modal').classList.add('show');
    $('#ai-settings-close').addEventListener('click', () => $('#modal').classList.remove('show'));
    $('#ai-settings-save').addEventListener('click', async () => {
      const newCfg = {
        backend: $('#ai-backend').value,
        pollinationsModel: $('#pol-model').value,
        pollinationsSize: parseInt($('#pol-size').value, 10) || 512,
        pollinationsSeed: $('#pol-seed').value.trim(),
        anthropicApiKey: $('#ant-apikey').value.trim() || cfg.anthropicApiKey || '',
        anthropicProxyUrl: $('#ant-proxyurl').value.trim() || DEFAULT_PROXY,
        anthropicModel: $('#ant-model').value.trim() || DEFAULT_ANTHROPIC_MODEL,
      };
      await saveAiConfig(newCfg);
      $('#modal').classList.remove('show');
      toast('✓ AI SETTINGS SAVED');
    });
    $('#ai-settings-clear').addEventListener('click', async () => {
      if (!confirm('Clear stored Anthropic API key?')) return;
      await saveAiConfig({ ...cfg, anthropicApiKey: '' });
      $('#modal').classList.remove('show');
      toast('API KEY CLEARED');
    });
  }

    // ============================================================
  // POKEDEX
  // ============================================================

  async function saveToDex() {
    if (!allStepsDone()) return;
    try {
      let all = [];
      const raw = await storage.get('dex:all');
      if (raw) { try { all = JSON.parse(raw); } catch(e) {} }
      const entry = {
        id: 'mon_' + Date.now() + '_' + rand(1000, 9999),
        dexNum: all.length + 1,
        name: state.name,
        species: state.species,
        rarity: state.rarity.name,
        rarityColor: state.rarity.color,
        type1: state.type1,
        type2: state.type2,
        isMystery: state.isMystery,
        stage: state.stage,
        perk: state.perk.name,
        perkIcon: state.perk.icon,
        perkDetail: state.perkDetail,
        stats: { ...state.stats },
        flavor: state.flavor,
        aiArtData: state.aiArtData,
        savedAt: Date.now(),
      };
      all.push(entry);
      await storage.set('dex:all', JSON.stringify(all));
      state.dexNum = entry.dexNum;
      toast(`✓ SAVED AS #${String(entry.dexNum).padStart(3, '0')}`);
      renderFinalView();
    } catch(e) {
      console.error('Save failed:', e);
      toast('SAVE FAILED: ' + e.message);
    }
  }

  async function loadDex() {
    const raw = await storage.get('dex:all');
    if (raw) { try { return JSON.parse(raw); } catch(e) { return []; } }
    return [];
  }
  async function deleteDexEntry(id) {
    const all = await loadDex();
    const filtered = all.filter(x => x.id !== id);
    await storage.set('dex:all', JSON.stringify(filtered));
  }

  let currentDexRarity = 'ALL';
  async function renderDex() {
    const all = await loadDex();
    const grid = $('#dex-grid');
    const raritiesEl = $('#dex-rarities');
    const allRarities = ['ALL', ...RARITIES.map(r => r.name)];
    raritiesEl.innerHTML = allRarities.map(r => {
      const count = r === 'ALL' ? all.length : all.filter(m => m.rarity === r).length;
      const active = r === currentDexRarity ? 'active' : '';
      return `<button class="dex-rarity-btn ${active}" data-rarity="${r}">${r}<span class="count">${count}</span></button>`;
    }).join('');
    raritiesEl.querySelectorAll('.dex-rarity-btn').forEach(b => {
      b.addEventListener('click', () => {
        currentDexRarity = b.dataset.rarity;
        renderDex();
      });
    });

    const filtered = currentDexRarity === 'ALL' ? all : all.filter(m => m.rarity === currentDexRarity);
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="dex-empty" style="grid-column: 1/-1;">
        ${all.length === 0 ? 'POKÉDEX EMPTY<br><br>Forge and save a mon to begin' : 'NO ENTRIES IN THIS CATEGORY'}
      </div>`;
      return;
    }
    filtered.sort((a,b) => a.dexNum - b.dexNum);
    grid.innerHTML = filtered.map(m => {
      let art;
      if (!m.aiArtData) art = `<div class="art-empty" style="padding:10px; font-size:14px;">NO ART</div>`;
      else if (m.aiArtData.startsWith('inline:')) art = m.aiArtData.slice(7);
      else art = `<img src="${m.aiArtData}" alt="${escapeHtml(m.name)}">`;
      return `<div class="dex-card" data-id="${m.id}">
        <div class="dex-card-art">${art}</div>
        <div class="rarity-banner" style="background:${m.rarityColor};">${m.rarity}</div>
        <div class="dex-card-num">No. ${String(m.dexNum).padStart(3, '0')}</div>
        <h3 class="dex-card-name">${escapeHtml(m.name)}</h3>
        <div class="type-chips">
          <span class="type-chip" style="background:${m.type1.color};">${m.type1.name}</span>
          ${m.type2 ? `<span class="type-chip" style="background:${m.type2.color};">${m.type2.name}${m.isMystery ? ' ★' : ''}</span>` : ''}
        </div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.dex-card').forEach(c => {
      c.addEventListener('click', () => showDexDetail(c.dataset.id, filtered));
    });
  }

  function showDexDetail(id, all) {
    const m = all.find(x => x.id === id);
    if (!m) return;
    let art;
    if (!m.aiArtData) art = `<div class="art-empty" style="padding:40px; font-size:14px;">NO ART GENERATED</div>`;
    else if (m.aiArtData.startsWith('inline:')) art = m.aiArtData.slice(7);
    else art = `<img src="${m.aiArtData}" alt="${escapeHtml(m.name)}">`;
    const total = Object.values(m.stats).reduce((a,b) => a + b, 0);
    const statsHtml = STAT_NAMES.map(s => {
      const v = m.stats[s];
      const pct = Math.min(100, (v / 200) * 100);
      return `<div class="stat-bar-row">
        <span class="stat-bar-name">${s}</span>
        <div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${pct}%;"></div></div>
        <span class="stat-bar-value">${v}</span>
      </div>`;
    }).join('');
    const perkHtml = m.perkDetail ? `<div class="perk-card">
      <div class="perk-head">${m.perkIcon || '✦'} ${escapeHtml(m.perk)}</div>
      <div class="perk-name">${escapeHtml(m.perkDetail.name)}</div>
      <div class="perk-desc">${escapeHtml(m.perkDetail.description)}</div>
    </div>` : `<div style="font-family:'VT323',monospace; color:var(--accent); text-align:center; margin:8px 0;">✦ ${escapeHtml(m.perk)}</div>`;
    $('#modal-content').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="dex-card-num">No. ${String(m.dexNum).padStart(3, '0')}</div>
        <button class="btn secondary" id="modal-close" style="padding:5px 8px;">✕</button>
      </div>
      <div class="dex-card-art" style="margin-bottom:12px;">${art}</div>
      <div class="rarity-banner" style="background:${m.rarityColor}; margin-bottom:8px;">${m.rarity}</div>
      <h2 class="poke-name">${escapeHtml(m.name)}</h2>
      <div class="poke-species" style="margin-bottom:10px;">${escapeHtml(m.species)}</div>
      <div class="type-chips" style="margin-bottom:12px;">
        <span class="type-chip" style="background:${m.type1.color};">${m.type1.name}</span>
        ${m.type2 ? `<span class="type-chip" style="background:${m.type2.color};">${m.type2.name}${m.isMystery ? ' ★' : ''}</span>` : ''}
      </div>
      <div class="dex-entry" style="margin-bottom:12px;">
        <div class="meta"><span>STAGE ${m.stage}</span><span>${m.perkIcon || '✦'} ${escapeHtml(m.perk)}</span></div>
        <div>${escapeHtml(m.flavor || '—')}</div>
      </div>
      ${perkHtml}
      <div style="margin-top:12px;">
        <div class="stats-top"><span>BASE STATS</span><span class="stats-total">${total}</span></div>
        ${statsHtml}
      </div>
      <button class="btn danger" id="modal-delete" style="width:100%; margin-top:12px;">DELETE ENTRY</button>
    `;
    $('#modal').classList.add('show');
    $('#modal-close').addEventListener('click', () => $('#modal').classList.remove('show'));
    $('#modal-delete').addEventListener('click', async () => {
      if (confirm('Delete ' + m.name + ' from Pokédex?')) {
        await deleteDexEntry(m.id);
        $('#modal').classList.remove('show');
        renderDex();
        toast('ENTRY DELETED');
      }
    });
  }

  // ============================================================
  // RESET + INIT
  // ============================================================

  function resetAll() {
    Object.assign(state, {
      rarity: null, typeCount: null, type1: null, type2: null,
      stage: null, perk: null, perkDetail: null,
      stats: { HP:null, ATK:null, DEF:null, SPA:null, SPD:null, SPE:null },
      name: null, species: null, flavor: null,
      aiArtData: null,
      isMystery: false,
      dexNum: null,
      step: 0,
      spinning: false,
      lastAiError: null,
    });
    $('#final-view').classList.add('hidden');
    $('#wizard-view').classList.remove('hidden');
    renderStep();
  }

  function init() {
    $$('.pf-tab').forEach(t => t.addEventListener('click', () => {
      $$('.pf-tab').forEach(x => x.classList.remove('active'));
      $$('.dex-page').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      $(`#page-${t.dataset.tab}`).classList.add('active');
      if (t.dataset.tab === 'dex') renderDex();
    }));
    $('#btn-back').addEventListener('click', () => {
      if (state.spinning) return;
      state.step = Math.max(0, state.step - 1);
      while (state.step > 0 && !isStepAvailable(state.step)) state.step--;
      renderStep();
    });
    $('#btn-next').addEventListener('click', () => {
      if (state.spinning) return;
      if (!isStepComplete(state.step)) return;
      state.step++;
      renderStep();
    });
    $('#btn-reset-wizard').addEventListener('click', () => {
      if (confirm('Reset all forge progress?')) resetAll();
    });
    $('#btn-generate-art').addEventListener('click', generateAiArt);
    $('#btn-procedural-art').addEventListener('click', applyProceduralArt);
    $('#btn-ai-settings').addEventListener('click', showAiSettings);
    $('#btn-save-dex').addEventListener('click', saveToDex);
    $('#btn-back-to-wizard').addEventListener('click', showWizardView);
    renderStep();
  }

  init();
})();
</script>
</div>
